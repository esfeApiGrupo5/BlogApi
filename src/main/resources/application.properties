# ======================================================
# ? CONFIGURACIÓN GENERAL DEL MICROSERVICIO
# ======================================================
spring.application.name=blog-Producto-microservice

# Desactivar configuración externa (config server)
spring.cloud.config.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# Dirección y puerto del servidor local
server.address=0.0.0.0
server.port=8081

# Identificador único para Eureka
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

# ======================================================
# ? CONEXIÓN CON EUREKA SERVER
# ======================================================
# ? Usa este si trabajas en LOCAL:
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ? (O usa este si trabajas en la nube con Render)
# eureka.client.service-url.defaultZone=https://eureka-server-1jnn.onrender.com/eureka/

